
<!DOCTYPE html>
<html lang="ru">
<head>

<body style="background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); min-height: 100vh; display: flex; align-items: center; margin: 0;">

            <div class="card-body p-5 text-center">

                <h4 class="mb-3">Пароль успешно изменён!</h4>
                <p class="text-muted mb-4">Ваш пароль был успешно изменён.</p>
                <div class="alert alert-success">
                    <i class="bi bi-info-circle me-2"></i>
                    Теперь вы можете войти с новым паролем.
                </div>
                <div class="mt-4">
                    <a href="/accounts/profile/" class="btn btn-lg me-3" style="background: linear-gradient(135deg, #E2725B 0%, #CC5A4F 100%); border: none; color: white; padding: 10px 30px; border-radius: 10px; text-decoration: none;">
