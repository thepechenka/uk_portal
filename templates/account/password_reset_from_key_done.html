{% extends "base.html" %}

{% block title %}Пароль изменен | УК "Новый город"{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow text-center" style="border-radius: 15px; border: none;">
                <div class="card-header text-white py-4" style="background: linear-gradient(135deg, #28a745 0%, #218838 100%); border-radius: 15px 15px 0 0;">
                    <h3 class="mb-0"><i class="bi bi-check-circle me-2"></i>Пароль изменен</h3>
                </div>
                <div class="card-body p-5">
                    <div class="mb-4">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                    </div>

                    <h4 class="mb-3">Успешно!</h4>

                    <p class="mb-4">
                        Ваш пароль был успешно изменен.<br>
                        Теперь вы можете войти с новым паролем.
                    </p>

                    <div class="d-grid gap-2">
                        <a href="{% url 'account_login' %}" class="btn btn-primary btn-lg py-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Войти
                        </a>
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-house me-2"></i>На главную
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.btn-primary {
    background: linear-gradient(135deg, #E2725B 0%, #CC5A4F 100%);
    border: none;
    font-weight: 600;
}
.btn-primary:hover {
    background: linear-gradient(135deg, #d1654f, #ff7a55);
}
</style>
{% endblock %}
