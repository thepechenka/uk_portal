<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}УК "Новый город"{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- Кастомные стили -->
    <style>
        :root {
            --primary-color: #E2725B;
            --primary-dark: #CC5A4F;
            --gradient: linear-gradient(135deg, #E2725B 0%, #CC5A4F 100%);
        }

        /* ОБЯЗАТЕЛЬНО ДОБАВЬ ЭТОТ КОД! */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1 0 auto;
            padding-bottom: 2rem; /* Отступ снизу для контента */
        }
        /* КОНЕЦ ОБЯЗАТЕЛЬНОГО КОДА */

        .text-primary {
            color: var(--primary-color) !important;
        }

        .bg-primary {
            background: var(--gradient) !important;
        }

        .navbar-brand {
            color: var(--primary-color) !important;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .btn-primary {
            background: var(--gradient) !important;
            border: none !important;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(226, 114, 91, 0.3);
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Включаем шапку -->
    {% include 'includes/header.html' %}

    <!-- Основной контент -->
    <main class="flex-shrink-0">
        {% block content %}{% endblock %}
    </main>

    <!-- Включаем подвал -->
    {% include 'includes/footer.html' %}

    <!-- Скрипты -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
